name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Biome
        run: yarn biome:check

      - name: Typecheck
        run: yarn typecheck

      # The cache (batching, dedupe, settling text by text) and the config plugin, in Node.
      - name: Test
        run: yarn test

      # Builds the library, packs it the way npm will receive it, and type-checks real usage from a throwaway
      # consumer: no `source` condition, only what the tarball declares.
      - name: Pack check
        run: yarn pack:check

  android:
    name: Android module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The module compiles inside the example's Gradle project, the way an app builds it, and its JVM tests run there.
      - name: Prebuild the example
        run: yarn workspace @hzblj/expo-translation build && yarn workspace expo-translation-example expo prebuild --platform android --no-install

      - name: Compile and test the module
        working-directory: apps/example/android
        run: ./gradlew :hzblj-expo-translation:compileDebugKotlin :hzblj-expo-translation:testDebugUnitTest --console=plain

  ios-core:
    name: Swift core
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Natural Language, the router and Apple's engine against the real framework (translating skips: no languages).
      - name: Test
        run: swift test --package-path packages/expo-translation/ios/Tests
